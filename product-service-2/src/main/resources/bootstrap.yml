spring:
  application:
    name: product-service-2
  cloud:
    compatibility-verifier:
      enabled: false
    config:
      uri: http://localhost:8001
      fail-fast: true
      password: admin
      username: user

  main:
    allow-bean-definition-overriding: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/main-changelog.xml



logging:
  level:
    org:
      springframework:
        context:
          support: trace
    root: "warn"
    org.springframework.web: "debug"
    org.hibernate: "error"

